name: Promemoria Dispensa

# Controlla ogni sera se la Dispensa e' stata aggiornata durante la giornata e,
# se non lo e' stata, manda una notifica push via ntfy.
on:
  schedule:
    # GitHub usa solo UTC e non conosce l'ora legale. Facciamo partire il job a
    # entrambi gli orari che possono corrispondere alle 22:00 italiane
    # (20:00 UTC con l'ora legale, 21:00 UTC con l'ora solare); lo script poi
    # prosegue solo se in Italia sono effettivamente le 22.
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:  # avvio manuale dalla scheda "Actions"
    inputs:
      forza_notifica:
        description: "Manda subito la notifica di prova (ignora il controllo attivita')"
        type: boolean
        default: false

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/dispensa_reminder.py
        env:
          FORZA_NOTIFICA: ${{ inputs.forza_notifica }}
